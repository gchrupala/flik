# Default configuration for FlikModel training

defaults:
  - _self_

# Model architecture
model:
  audio_model_name: "facebook/wav2vec2-base"
  video_model_name: "MCG-NJU/videomae-base"
  hidden_dim: 768
  audio_feature_layer: 7
  temporal_layers: 2
  cross_attention_layers: 2
  num_heads: 8
  ff_dim: 3072
  dropout: 0.1
  freeze_audio: false
  freeze_video: false
  use_grounded_masked_prediction: false
  mlm_mask_prob: 0.15
  mlm_mask_length: 1
  num_codebook_entries: 320

# Dataset
dataset:
  manifest_path: "data/expanded_manifest_segments.json"  # expanded segment-level manifest (all transcript segments from passing videos, no CLIP segment filter, no pre-validation)
  sample_rate: 16000
  num_frames: 16
  min_duration: 3.0
  max_duration: 10.0
  dummy: false  # set to true for testing
  val_manifest_path: null  # frozen validation pool manifest (e.g. data/val_pool.json); null = runtime split
  dedup_report_path: null  # movie-level dedup report for grouping hold-outs (e.g. data/dedup_report.json); null = group by video_id
  # Audio window alignment. The historical default (false) is a BUG, not a
  # feature: _load_audio_segment seeks to the previous video keyframe and trims
  # the pre-roll from the FRONT, so every audio window started early by the
  # keyframe gap (measured mean ~2.3-2.5 s, worst ~8 s on the local films).
  # true = drop the pre-roll by decoded PTS so the window starts at start_sec.
  # Runs logged before 2026-09-16 used the buggy path; map them to
  # audio_align_to_start: false when comparing against old checkpoints/logs.
  audio_align_to_start: true

# DataLoader
dataloader:
  batch_size: 64  # effective batch for contrastive learning (DCL makes this viable)
  shuffle: true
  num_workers: 12  # parallel data loading (Snellius A100 slice has 18 CPU cores)
  pin_memory: true
  drop_last: true
  persistent_workers: true  # keep workers alive across epochs (avoids restart overhead)
  prefetch_factor: 4  # prefetch batches to keep GPU fed

# Training
training:
  num_epochs: 50
  gradient_accumulation_steps: 1
  clip_grad_norm: 1.0
  mixed_precision: true  # use AMP (now actually honored)
  gradient_checkpointing: true  # trade compute for memory on large batches
  freeze_encoder_epochs: 3  # freeze pretrained encoders for first N epochs (projection head warmup)
  checkpoint_dir: "checkpoints"
  checkpoint_frequency: 1000  # steps
  eval_every_n_epochs: 1  # run retrieval eval every N epochs (always on last epoch); 1 = every epoch
  log_frequency: 10  # steps
  run_retrieval_eval: true
  resume_from: null          # path to checkpoint .pth to resume from (null = fresh start)

# Optimizer
optimizer:
  type: "adamw"
  lr: 1.0e-3  # LR for new modules (projection heads, temporal transformer, cross-modal)
  encoder_lr: 5.0e-6  # LR for pretrained encoders (wav2vec2, videomae) after warmup — halved from 1e-5 to reduce the post-unfreeze shock that triggered collapse
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

# Scheduler
scheduler:
  type: "cosine_with_warmup"
  total_steps: null  # auto‑computed from dataset size
  warmup_steps: 500  # linear warmup for LR
  eta_min: 1.0e-7

# Loss
loss:
  contrastive_weight: 1.0
  mlm_weight: 0.0  # MLM disabled (no valid teacher); set >0 only with a real quantizer
  temperature: 0.1  # raised from 0.07 — softer softmax reduces collapse risk under DCL with few negatives
  use_dcl: true  # Decoupled Contrastive Learning — removes batch-size dependence
  mlm_label_smoothing: 0.0
  variance_weight: 0.5  # VICReg variance regularization — penalizes embedding collapse (std -> 0); 0 disables
  variance_gamma: null  # target per-dim std; null = auto 1/sqrt(hidden_dim) ≈ 0.036 for L2-normalized 768-d embeddings

# Logging
logging:
  use_wandb: false            # toggle to true to enable WandB
  use_tensorboard: true
  log_dir: "logdir"
  wandb:
    project: "flik-video-grounding"
    entity: null              # your wandb username or team
    offline: false            # true = no network needed

# Hardware
hardware:
  device: "cuda"
  ddp_timeout_min: 30        # NCCL init timeout in minutes (multi-node may need longer)

# Validation (retrieval metrics)
validation:
  retrieval_top_k: [1, 5, 10]
  eval_batch_size: 16
  split_ratio: 0.1            # fraction of unique videos held out for validation (0 = no split, eval on train)
  split_seed: 42              # deterministic seed for the video-level split
  select_metric: "mean_r1"    # checkpoint-selection metric: mean_r1 (legacy default) or hits5_sum (frozen protocol)
  # --- Frozen-pool selection (opt-in; defaults preserve legacy behaviour) ---
  enable_frozen_selection: false  # true = gate checkpoint_best on hits5_sum + 2*sigma and pick the trailing-3 winner
  min_improve_sigma: 2.0          # live update requires hits5_sum > best + min_improve_sigma * sigma
  history_path: null              # per-epoch metric/hit-vector history JSON; null = <checkpoint_dir>/val_history.json
  dump_embeddings: false          # true = save validation embeddings per eval (large)
