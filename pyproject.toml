[project]
name = "flik"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# torch 2.8.x (required by whisperx) only publishes cp311–cp313 wheels, so cap <3.14.
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets>=4.4.2",
    "langdetect>=1.0.9",
    "opencv-python>=4.12.0.88",
    "whisperx>=3.7.2",
    "transformers>=4.37.0",
    "av>=12.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
]

# Accelerator extras — pick exactly one via:
#   uv sync --extra cpu | cu128
# whisperx pins torch~=2.8.0, and torch 2.8.x is only published for cu128 (+cpu),
# so only these two variants are resolvable. See AGENTS.md for adding more.
[project.optional-dependencies]
cpu = [
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
]
cu128 = [
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
]

[dependency-groups]
dev = [
    "tensorboard>=2.20.0",
    "wandb>=0.26.1",
]

[tool.uv]
# The accelerator extras are mutually exclusive — pick exactly one via:
#   uv sync --extra cpu | cu128
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


